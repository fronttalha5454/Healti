<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="application-name" content="Healthi" />
    <meta name="apple-mobile-web-app-title" content="Healthi" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Healthi - Antrenman, beslenme ve uyku için kişisel sağlıklı yaşam koçun" />
    <!-- %HEALTHI_CSP% -->
    <title>Healthi</title>
    <style>
      body {
        margin: 0;
        background: #0a0a1a;
        color: #f8fafc;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      .boot-splash {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: system-ui, sans-serif;
        color: #94a3b8;
        font-size: 14px;
      }
      .boot-splash strong {
        font-size: 28px;
        color: #f8fafc;
        letter-spacing: 0.5px;
      }
      #error-display {
        display: none;
        position: fixed;
        inset: 0;
        background: #1a1a2e;
        color: #fff;
        padding: 20px;
        font-family: monospace;
        font-size: 12px;
        overflow: auto;
        z-index: 99999;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
    <script src="/boot-error.js"></script>
  </head>
  <body>
    <div id="error-display"></div>
    <div id="root" data-booting="true">
      <div class="boot-splash"><strong>Healthi</strong><span>Yükleniyor…</span></div>
    </div>
    <noscript>Healthi'yi kullanmak için JavaScript'i etkinleştir.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
